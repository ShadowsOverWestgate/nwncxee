# GitHub side of releases (map #1, #524). A v* tag mirrored from Gitea builds the
# Linux extender on ubuntu-latest and the Windows one on windows-latest, then
# uploads both zips + SHA256SUMS to the GITEA release for the tag over its REST
# API. GitHub is only the worker (it has the Windows runner); players download from
# https://git.westgate.pw/ShadowsOverWestgate/sow-client-extender/releases, which
# only works while that repo stays publicly readable. Tag-gated, never on PR.
#
# Windows is a NATIVE build on windows-latest (#504, build-win-native.sh); the Linux cross-build
# (build-win.sh) is a dev tool and never ships. Both zips are published together by the publish job.
# The release body comes from packaging/RELEASE-BODY.md and names the pinned
# client build (SymbolMap.WindowsBuildStamp), since the Windows artifact is
# locked to one client build (#421).
#
# Gitea Actions reads .github/workflows/ too, so this file is fenced to GitHub:
# Gitea has no ubuntu-latest runner and a waiting job must not block its own
# release workflow (distinct concurrency group + the server_url guard).
name: release

on:
  push:
    tags: ['v*']
  # Re-run / backfill an existing tag from main's workflow file (the file at an old
  # tag is the old publish): gh workflow run release --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag: { description: existing v* tag to (re)publish, required: true }

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GITEA_API: https://git.westgate.pw/api/v1/repos/ShadowsOverWestgate/sow-client-extender

jobs:
  linux:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] \
            || { printf "unsupported release tag: %s\n" "$TAG" >&2; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # build.sh stamps the version from `git describe --tags`
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Install native toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld zlib1g-dev cmake

      - name: Build + package
        run: |
          set -euo pipefail
          ./build.sh
          rm -rf dist && mkdir -p dist
          # build.sh zips the CONTENTS of cx-linux-x64/ (flat), so
          # "unpack into bin/linux-x86" is literally the whole install.
          mv cx-linux-x64.zip "dist/cx-linux-x64-${TAG}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: linux, path: dist/*.zip, if-no-files-found: error }

  windows:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Git for Windows defaults to autocrlf=true; a CRLF submodule tree makes the LF funchook patch not apply.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The symbol gate (tools/abi/check-win-symbols.py) needs llvm-undname and a real nwmain.exe; the
      # runner has neither, so the script skips it. It runs on the dev box via build-win.sh.
      - name: Build + package
        shell: bash
        run: |
          set -euo pipefail
          ./build-win-native.sh
          mkdir -p dist && mv cx-windows-x64.zip "dist/cx-windows-x64-${TAG}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: windows, path: dist/*.zip, if-no-files-found: error }

  publish:
    if: github.server_url == 'https://github.com'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.TAG }}" }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, merge-multiple: true }

      # Idempotent: GET-first because POST on a tag that already has a release is 409,
      # and same-name assets are deleted before re-upload so workflow_dispatch re-runs
      # replace instead of failing. Also re-PATCHes prerelease (old runs left rc tags false).
      - name: Publish to the Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          ( cd dist && sha256sum *.zip > SHA256SUMS )
          stamp=$(grep -oE "WindowsBuildStamp = 0x[0-9a-f]+" managed/Framework/SymbolMap.cs | grep -oE "0x[0-9a-f]+")
          sed "s/@VERSION@/${TAG}/g; s/@STAMP@/${stamp}/g" packaging/RELEASE-BODY.md > body.md
          pre=false; [[ "$TAG" == *-rc* ]] && pre=true
          api() { curl -sSf -H "Authorization: token $GITEA_TOKEN" "$@"; }
          payload=$(jq -n --arg tag "$TAG" --argjson pre "$pre" --rawfile body body.md \
            '{tag_name:$tag, name:$tag, body:$body, prerelease:$pre, draft:false}')
          if id=$(api "$GITEA_API/releases/tags/$TAG" 2>/dev/null | jq -r .id); then
            api -X PATCH -H "Content-Type: application/json" -d "$payload" "$GITEA_API/releases/$id" > /dev/null
          else
            id=$(api -X POST -H "Content-Type: application/json" -d "$payload" "$GITEA_API/releases" | jq -r .id)
          fi
          for f in dist/*; do
            name=$(basename "$f")
            api "$GITEA_API/releases/$id/assets" | jq -r --arg n "$name" '.[] | select(.name==$n) | .id' \
              | while read -r aid; do api -X DELETE "$GITEA_API/releases/$id/assets/$aid"; done
            api -X POST -F "attachment=@$f" "$GITEA_API/releases/$id/assets?name=$name" > /dev/null
          done
          echo "published $TAG (release $id) with: $(ls dist | tr '\n' ' ')"
