# Pull-request validation: build the extender and prove it loads C# into a
# foreign process (run-demo.sh, no game needed). There is no unit-test project
# yet, so the build + load smoke IS the gate. Releases are built by GitHub
# Actions on the mirror (.github/workflows/release.yml) and published to this
# repo's release page. gates.yml runs the rule gates on every pull request.
name: ci

on:
  pull_request:
    # Only a build input builds: the sources, the build scripts, the toolchain pin and the tools build.sh runs.
    # For any other pull request Gitea reports `ci / ci` as skipped, which the required check accepts.
    # When build.sh, or a script it calls, reads a file outside this list, add the file here.
    # LICENSE and third_party/ are here because packaging/licenses.sh copies their notices into LICENSES.txt.
    paths:
      - managed/**
      - native/**
      - third_party/**
      - build.sh
      - run-demo.sh
      - flake.nix
      - flake.lock
      - .gitmodules
      - .gitea/workflows/ci.yml
      - tools/engine/**
      - tools/build-openal.sh
      - tools/deps.json
      - tools/deps.py
      - packaging/cx-launch
      - packaging/licenses.sh
      - packaging/README.txt
      - LICENSE

permissions: read-all

# One run per ref: a new push obsoletes the run on the old head, so cancel it
# and free the runner slot for the run that can still matter.
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: nix-cx
    # A cache hit takes about 3 min. A miss builds OpenAL Soft from source and takes about 6.5 min.
    # The timeout is a crash guard with room for a slow miss.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      # Every job starts with an empty Nix store. The ci shell pulls flake.nix's OpenAL Soft from the binary
      # cache, or builds it when the cache misses. A cache that does not answer within 5 seconds costs a local
      # build, not a failed job. Nothing here pushes to the cache: docs/binary-cache.md says when and how a
      # maintainer refills it.
      # run-demo.sh runs what build.sh just staged instead of building it a second time.
      - name: Build + load smoke
        run: |
          nix develop .#ci --option extra-substituters https://westgate.cachix.org --option connect-timeout 5 \
            --command env JOBS=2 bash -c '
            set -euo pipefail
            ./build.sh
            CX_NO_BUILD=1 ./run-demo.sh
          '
