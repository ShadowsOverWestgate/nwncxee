# Pull-request validation: build the extender and prove it loads C# into a
# foreign process (run-demo.sh, no game needed). There is no unit-test project
# yet, so the build + load smoke IS the gate. Releases are built by GitHub
# Actions on the mirror (.github/workflows/release.yml, map #1) and published to
# this repo's Gitea release page (#524).
name: ci

on:
  pull_request:

permissions: read-all

# One run per ref: a new push obsoletes the run on the old head, so cancel it
# and free the runner slot for the run that can still matter.
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # No path filter on the workflow: a workflow that never starts never reports, and a required check then
  # blocks the merge. This job decides instead; a skipped `ci` still reports. Anything not provably prose
  # builds, so a new kind of file costs a build, never a silent skip. third_party/ is excluded because
  # packaging/licenses.sh reads its markdown.
  affected:
    runs-on: nix-docker
    timeout-minutes: 2
    outputs:
      build: ${{ steps.map.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Anything besides prose?
        id: map
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files="$(git diff --name-only "$BASE_SHA" HEAD)"
          code="$(grep -Ev '\.md$|^docs/|^\.claude/|^\.vscode/|^LICENSE$' <<<"$files";
            grep -E '^third_party/.*\.md$' <<<"$files")" || true
          [ -n "$files" ] || code="(empty diff: building to be safe)"
          printf 'needs a build:\n%s\n' "${code:-(nothing)}"
          echo "build=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Every pull request, whatever it touches: a listing can hide in any file,
  # Markdown included, so this job never asks `affected` (sow-platform ADR-0064).
  no-decompiled:
    runs-on: nix-docker
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No decompiled code in the tree
        run: bash tools/no-decompiled-contract.sh && bash tools/no-decompiled.sh

  ci:
    needs: affected
    if: needs.affected.outputs.build == 'true'
    runs-on: nix-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      # The built libopenal.so.1 (see release.yml): the OpenAL Soft compile runs once per pin, not per PR.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with: { path: build/openal, key: "openal-nix-${{ hashFiles('tools/deps.py') }}-v1" }

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with: { path: ~/.cache/cx-deps, key: "cx-deps-${{ hashFiles('tools/deps.py') }}" }

      - name: Build + load smoke
        run: |
          # CX-57: OpenAL Soft's backends. `nix shell` runs no setup hooks, so pkg-config (PipeWire) and CMake's
          # find_library (PulseAudio, ALSA) are told where they are.
          P=$(nix build --no-link --print-out-paths nixpkgs#pipewire nixpkgs#pipewire.dev nixpkgs#libpulseaudio \
                nixpkgs#libpulseaudio.dev nixpkgs#alsa-lib nixpkgs#alsa-lib.dev)
          PC=$(echo "$P" | grep -- '-dev$' | sed 's|$|/lib/pkgconfig|' | paste -sd:)
          nix shell nixpkgs#dotnet-sdk_10 nixpkgs#cmake nixpkgs#gnumake nixpkgs#clang \
            nixpkgs#lld nixpkgs#zlib nixpkgs#gcc nixpkgs#python3 nixpkgs#pkg-config \
            --command env JOBS=2 PKG_CONFIG_PATH="$PC" CMAKE_PREFIX_PATH="$(echo "$P" | paste -sd:)" bash -c '
              set -euo pipefail
              ./build.sh
              ./run-demo.sh
            '
