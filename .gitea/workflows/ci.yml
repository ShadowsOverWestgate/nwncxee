# Pull-request validation: build the extender and prove it loads C# into a
# foreign process (run-demo.sh, no game needed). There is no unit-test project
# yet, so the build + load smoke IS the gate. Releases are built by GitHub
# Actions on the mirror (.github/workflows/release.yml, map #1) and published to
# this repo's Gitea release page (#524).
name: ci

on:
  pull_request:

permissions: read-all

# One run per ref: a new push obsoletes the run on the old head, so cancel it
# and free the runner slot for the run that can still matter.
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: nix-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      - name: Build + load smoke
        run: |
          # CX-57: OpenAL Soft's backends. `nix shell` runs no setup hooks, so pkg-config (PipeWire) and CMake's
          # find_library (PulseAudio, ALSA) are told where they are.
          P=$(nix build --no-link --print-out-paths nixpkgs#pipewire nixpkgs#pipewire.dev nixpkgs#libpulseaudio \
                nixpkgs#libpulseaudio.dev nixpkgs#alsa-lib nixpkgs#alsa-lib.dev)
          PC=$(echo "$P" | grep -- '-dev$' | sed 's|$|/lib/pkgconfig|' | paste -sd:)
          nix shell nixpkgs#dotnet-sdk_10 nixpkgs#cmake nixpkgs#gnumake nixpkgs#clang \
            nixpkgs#lld nixpkgs#zlib nixpkgs#gcc nixpkgs#python3 nixpkgs#pkg-config \
            --command env PKG_CONFIG_PATH="$PC" CMAKE_PREFIX_PATH="$(echo "$P" | paste -sd:)" bash -c '
              set -euo pipefail
              ./build.sh
              ./run-demo.sh
            '
