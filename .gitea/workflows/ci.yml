# Pull-request validation: build the extender and prove it loads C# into a
# foreign process (run-demo.sh, no game needed). There is no unit-test project
# yet, so the build + load smoke IS the gate. Releases are built by GitHub
# Actions on the mirror (.github/workflows/release.yml, map #1) and published to
# this repo's Gitea release page (#524).
name: ci

on:
  pull_request:

permissions: read-all

# One run per ref: a new push obsoletes the run on the old head, so cancel it
# and free the runner slot for the run that can still matter.
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # No path filter on the workflow: a workflow that never starts never reports, and a required check then
  # blocks the merge. This job decides instead; a skipped `ci` still reports. Anything not provably prose
  # builds, so a new kind of file costs a build, never a silent skip. third_party/ is excluded because
  # packaging/licenses.sh reads its markdown.
  affected:
    runs-on: nix-docker
    timeout-minutes: 2
    outputs:
      build: ${{ steps.map.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Anything besides prose?
        id: map
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files="$(git diff --name-only "$BASE_SHA" HEAD)"
          code="$(grep -Ev '\.md$|^docs/|^\.claude/|^\.vscode/|^LICENSE$' <<<"$files";
            grep -E '^third_party/.*\.md$' <<<"$files")" || true
          [ -n "$files" ] || code="(empty diff: building to be safe)"
          printf 'needs a build:\n%s\n' "${code:-(nothing)}"
          echo "build=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Every pull request, whatever it touches: a listing can hide in any file,
  # Markdown included, so this job never asks `affected`.
  no-decompiled:
    runs-on: nix-docker
    # Measured 37s on a cold runner that had to fetch the pinned nixpkgs first (run 10074).
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # flake.nix's gates shell: the pinned Python and git, nothing that needs a compiler.
      - name: No decompiled code in the tree
        run: nix develop .#gates --command bash -c 'bash tools/no-decompiled-contract.sh && bash tools/no-decompiled.sh'
      # CX-192: the rule gates (tools/gates/), here too so a PR that skips the local build still fails.
      - name: Rule gates
        run: nix develop .#gates --command bash tools/gates/run.sh

  ci:
    needs: affected
    if: needs.affected.outputs.build == 'true'
    runs-on: nix-docker
    # Measured 4m04 on the cold path (run 10075), where the runner first builds flake.nix's OpenAL Soft for
    # 2m21. Roughly twice that.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      # Only a runner that had to fetch or build OpenAL Soft pushes it, so each runner contacts Cachix once per pin.
      - name: Is OpenAL Soft in this runner's store already?
        id: openal
        run: |
          path=$(nix eval --raw .#openal.outPath)
          if nix path-info "$path" >/dev/null 2>&1; then fresh=false; else fresh=true; fi
          printf 'path=%s\nfresh=%s\n' "$path" "$fresh" | tee -a "$GITHUB_OUTPUT"

      # No cache actions: the runner's Nix store and HOME persist between jobs. The ci shell carries the
      # OpenAL Soft that flake.nix builds once per pin, or pulls from the westgate Cachix cache when the runner
      # trusts it. A cache that does not answer within 5 seconds costs a local build, not a failed job.
      # tools/deps.py keeps its archives in ~/.cache/cx-deps.
      # run-demo.sh runs what build.sh just staged instead of building it a second time.
      - name: Build + load smoke
        run: |
          # The installable stays first: the runner's nix shim reads it to name the shell's GC root.
          nix develop .#ci --option extra-substituters https://westgate.cachix.org --option connect-timeout 5 \
            --command env JOBS=2 bash -c '
            set -euo pipefail
            ./build.sh
            CX_NO_BUILD=1 ./run-demo.sh
          '

      # Best effort with a ceiling: a Cachix outage costs this step 30 seconds and never fails the job.
      - name: Share OpenAL Soft on Cachix
        if: steps.openal.outputs.fresh == 'true' && vars.CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix shell --inputs-from . nixpkgs#cachix --command \
            timeout 30 cachix push "${{ vars.CACHIX_CACHE }}" "${{ steps.openal.outputs.path }}" \
            || echo "::warning::cachix push failed or timed out; the next runner to miss builds OpenAL Soft itself"
