# A v* tag builds the Linux extender and attaches it (+ SHA256SUMS) to its
# Gitea release. Tag-gated, never on PR (AGENTS.md CI law).
#
# Windows is NOT built here: the release artifact is a native build on a Windows
# runner (GitHub Actions, map #1 / #504). build-win.sh is a developer tool only.
# The release body comes from packaging/RELEASE-BODY.md and names the pinned
# client build (SymbolMap.WindowsBuildStamp), since the Windows artifact is
# locked to one client build (#421).
name: release

on:
  push:
    tags: ['v*']

permissions:
  code: read
  releases: write

# The shared runner runs 2 jobs at once; serialize releases explicitly and
# never cancel mid-run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: nix-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] \
            || { printf "unsupported release tag: %s\n" "$TAG" >&2; exit 1; }

      - name: Build + package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          nix shell nixpkgs#dotnet-sdk_10 nixpkgs#cmake nixpkgs#gnumake nixpkgs#clang \
            nixpkgs#lld nixpkgs#zlib nixpkgs#gcc nixpkgs#python3 nixpkgs#gnused nixpkgs#gnugrep \
            nixpkgs#coreutils --command bash -c '
              set -euo pipefail
              ./build.sh
              rm -rf dist && mkdir -p dist
              # build.sh zips the CONTENTS of sow-client-extender/ (flat), so
              # "unpack into bin/linux-x86" is literally the whole install.
              mv sow-client-extender.zip "dist/sowx-linux-x64-${TAG}.zip"
              ( cd dist && sha256sum *.zip > SHA256SUMS )
              stamp=$(grep -oE "WindowsBuildStamp = 0x[0-9a-f]+" managed/Framework/SymbolMap.cs | grep -oE "0x[0-9a-f]+")
              sed "s/@VERSION@/${TAG}/g; s/@STAMP@/${stamp}/g" packaging/RELEASE-BODY.md > body.md
            '

      - name: Upload to Gitea release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          nix shell nixpkgs#curl nixpkgs#coreutils nixpkgs#gnugrep nixpkgs#python3 --command bash -c '
            set -euo pipefail
            api="${SERVER}/api/v1/repos/${REPO}"
            auth="Authorization: token ${TOKEN}"
            payload=$(python3 -c "import json,sys,os; print(json.dumps({\"tag_name\":os.environ[\"TAG\"],\"name\":os.environ[\"TAG\"],\"body\":open(\"body.md\").read()}))")
            # Create the release (ignore "already exists"), then read its id.
            curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              "${api}/releases" -d "$payload" || true
            id="$(curl -fsS -H "$auth" "${api}/releases/tags/${TAG}" \
              | grep -o "\"id\":[0-9]*" | head -1 | cut -d: -f2)"
            for f in dist/*; do
              echo "uploading $(basename "$f")"
              curl -fsS -X POST -H "$auth" \
                -F "attachment=@${f}" \
                "${api}/releases/${id}/assets?name=$(basename "$f")"
            done
          '
