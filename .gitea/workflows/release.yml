# A v* tag builds the Linux extender and attaches it (+ SHA256SUMS) to its
# Gitea release. Tag-gated, never on PR (AGENTS.md CI law).
#
# Windows is NOT built here: there is no Windows runner (sow-platform
# gitea-runner.nix has none) and the cross-build needs clang-cl/lld-link plus a
# Windows 10 SDK + MSVC lib tree that the nix shell does not carry. Hand-build per
# release: ./build-win.sh on Linux stages sow-client-extender-win/ (version.dll +
# funchook.dll + sowx_managed.dll + font + README) and zips it; attach the zip to
# the same release. Record the client build stamp (SymbolMap.WindowsBuildStamp) in
# the release body: the Windows artifact is pinned to one client build (#421).
name: release

on:
  push:
    tags: ['v*']

permissions:
  code: read
  releases: write

# The shared runner runs 2 jobs at once; serialize releases explicitly and
# never cancel mid-run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: nix-docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] \
            || { printf "unsupported release tag: %s\n" "$TAG" >&2; exit 1; }

      - name: Build + package
        run: |
          nix shell nixpkgs#dotnet-sdk_10 nixpkgs#cmake nixpkgs#gnumake nixpkgs#clang \
            nixpkgs#lld nixpkgs#zlib nixpkgs#gcc nixpkgs#gnutar nixpkgs#gzip nixpkgs#python3 \
            nixpkgs#coreutils --command bash -c '
              set -euo pipefail
              ./build.sh
              rm -rf dist && mkdir -p dist
              # build.sh stages a ready-to-run sow-client-extender/ folder (the
              # wrapper + the 3 .so files, symlinks already resolved). Ship that
              # whole folder so the player unpacks and runs sowx-launch.
              tar czf dist/sowx-linux-x64.tar.gz sow-client-extender
              ( cd dist && sha256sum sowx-linux-x64.tar.gz > SHA256SUMS )
            '

      - name: Upload to Gitea release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          nix shell nixpkgs#curl nixpkgs#coreutils nixpkgs#gnugrep --command bash -c '
            set -euo pipefail
            api="${SERVER}/api/v1/repos/${REPO}"
            auth="Authorization: token ${TOKEN}"
            # Create the release (ignore "already exists"), then read its id.
            curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              "${api}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\"}" || true
            id="$(curl -fsS -H "$auth" "${api}/releases/tags/${TAG}" \
              | grep -o "\"id\":[0-9]*" | head -1 | cut -d: -f2)"
            for f in dist/*; do
              echo "uploading $(basename "$f")"
              curl -fsS -X POST -H "$auth" \
                -F "attachment=@${f}" \
                "${api}/releases/${id}/assets?name=$(basename "$f")"
            done
          '
