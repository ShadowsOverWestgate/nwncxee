# The decompiled-code check and the rule gates, on every pull request whatever it touches: a listing can
# hide in any file, Markdown included. The workflow is named ci so its check stays `ci / no-decompiled`.
name: ci

on:
  pull_request:

permissions: read-all

# One run per ref, apart from ci.yml's group so the two workflows never cancel each other.
concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-decompiled:
    runs-on: nix-cx
    # Measured 37s on a cold runner that had to fetch the pinned nixpkgs first.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # flake.nix's gates shell: the pinned Python, git and the workflow linters, nothing that needs a compiler.
      - name: No decompiled code in the tree
        run: nix develop .#gates --command bash -c 'bash tools/no-decompiled-contract.sh && bash tools/no-decompiled.sh'
      # The rule gates (tools/gates/), here too so a pull request that skips the local build still fails.
      - name: Rule gates
        run: nix develop .#gates --command bash tools/gates/run.sh
